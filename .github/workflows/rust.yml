name: Test Rust code

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reposistory
        uses: actions/checkout@v5

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Check clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reposistory
        uses: actions/checkout@v5

      - name: Run cargo clippy
        run: |
          cargo clippy --version
          cargo clippy --all --all-targets --all-features -- -D warnings

  test:
    name: Test on ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux
            runner: ubuntu-latest
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest

    steps:
      - name: Checkout reposistory
        uses: actions/checkout@v6

      - name: Test
        run: cargo test -F std

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reposistory
        uses: actions/checkout@v5

      - name: Setup MSRV checker
        uses: taiki-e/install-action@cargo-hack

      # To find current MSRV use `cargo msrv find`. Install it with `cargo install cargo-msrv --locked`
      - name: Run MSRV checker
        run: cargo hack check --rust-version --workspace --all-targets --ignore-private

  msrv_no_default:
    name: Check MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reposistory
        uses: actions/checkout@v5

      - name: Setup MSRV checker
        uses: taiki-e/install-action@cargo-hack

      # To find current MSRV use `cargo msrv find`. Install it with `cargo install cargo-msrv --locked`
      - name: Run MSRV checker
        run: cargo hack check --rust-version --workspace --all-targets --ignore-private --no-default-features
