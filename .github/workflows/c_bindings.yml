name: C bindings

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-c-bindings:
    name: Test C bindings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@main

      - name: Make C test program
        run: make -C c_bindings BUILD_MODE=release

      - name: Run tests
        run: c_bindings/tests.elf

  release:
    name: Release ${{ matrix.crate-type }} for ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-gnu
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        crate-type:
          - staticlib
        include:
          - target: x86_64-pc-windows-gnu
            archive: zip
            os_name: windows
            runner: windows-latest
          - target: x86_64-pc-windows-msvc
            archive: zip
            os_name: windows
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            archive: zip
            os_name: windows
            runner: windows-latest
          - target: x86_64-apple-darwin
            archive: zip
            os_name: macos
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            archive: zip
            os_name: macos
            runner: macos-latest
          - target: x86_64-unknown-linux-musl
            archive: tar.gz
            os_name: linux
            runner: ubuntu-22.04
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
            os_name: linux
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            archive: tar.gz
            os_name: linux
            runner: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@main

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build lib
        run: cargo rustc --manifest-path lib/Cargo.toml --lib --features c_bindings --release --crate-type ${{ matrix.crate-type }} --target ${{ matrix.target }}

      - name: Install tree
        if: matrix.os_name == 'macos'
        run:
          brew install tree

      - name: Print built files
        run: |
          tree target/${{ matrix.target }}/release

      - name: Move files for packaging
        run: |
          mkdir package package/lib package/include
          cp target/${{ matrix.target }}/release/libcrunch64.a package/lib/ || cp target/${{ matrix.target }}/release/crunch64.lib package/lib/
          cp -r c_bindings/include/* package/include/
          cp LICENSE package/crunch64.LICENSEzip
          cp README.md package/crunch64.README.md
          tree package

      - name: Package .tar.gz
        if: matrix.archive == 'tar.gz'
        run: |
          cd package && tar -czf ../crunch64-${{ matrix.crate-type }}-${{ matrix.target }}.tar.gz *

      - name: Package .zip
        if: matrix.archive == 'zip'
        run: |
          cd package && zip -r ../crunch64-${{ matrix.crate-type }}-${{ matrix.target }}.zip *

      - name: Upload ${{ matrix.archive }} archive
        uses: actions/upload-artifact@main
        with:
          name: crunch64-${{ matrix.crate-type }}-${{ matrix.target }}
          path: |
            crunch64-${{ matrix.crate-type }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

      # - name: Test built archive
      #   if: matrix.target_group == 'unix'
      #   run: |
      #     cc -I c_bindings/include/ c_bindings/tests.c -L package/lib/ -l crunch64 -o tests.elf
      #     ./tests.elf

      - name: Publish ${{ matrix.archive }} release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: crunch64-${{ matrix.crate-type }}-${{ matrix.target }}.${{ matrix.archive }}
