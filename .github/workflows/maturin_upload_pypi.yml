name: Upload to PyPI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out ../dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
          working-directory: lib/
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out ../dist -i python3.14t
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
          working-directory: lib/
      - name: Upload wheels
        uses: actions/upload-artifact@main
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
          if-no-files-found: error

      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Print
        run: |
          find ./dist/ -name "crunch64-*-abi3-*"
      - name: Print 2
        run: |
          tree "./dist/"
      - name: Test wheels
        # Check the built wheel is installable on the oldest Python supported
        run: |
          find ./dist/ -name "crunch64-*-abi3-*"
          uv venv -p 3.8
          source .venv/bin/activate
          uv pip install $(find ./dist/ -name "crunch64-*-abi3-*")
          uvx python -c "import crunch64; print(crunch64.__version__)"

  musllinux:
